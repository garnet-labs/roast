# garnet-runtime-review: installed by a coding agent (devin-plugin)
name: Garnet Runtime Visibility

on:
  push:
    branches: ['main']
  pull_request:

permissions: {}

concurrency:
  group: garnet-record-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  dep-install:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: garnet-org/action@673a06d87748bec49e4d8df22d371b2a3420aba4 # v2.5.2
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ripgrep graphviz wamerican
      - uses: ruby/setup-ruby@f9c4492e86def3e644ab32a0ef185eda5b0c20d0 # v1
        with:
          bundler-cache: false
      - name: Install dependencies
        run: bundle install
      - name: Let sensor settle
        if: always()
        run: sleep 30
